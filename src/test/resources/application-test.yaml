spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisReactiveAutoConfiguration
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
  datasource:
    url: jdbc:hsqldb:mem:testdb
    username: sa
    password:
    driver-class-name: org.hsqldb.jdbc.JDBCDriver
  redis:
    host: localhost
    port: 6379
  rabbitmq:
    host: localhost
    port: 5672
app:
  default-expire-after: 1000000000
  lock-timeout-seconds: 10
  retry-count: 5
  retry-sleep-ms: 50
  default-expire-time: 10000000000
  sentinel-view-count: -9999
  update-code-regex: ^[a-zA-Z0-9]{4,16}$
  executor:
    core-pool-size: 10
    max-pool-size: 100
    queue-capacity: 1000
  mq-view-queue: view.queue
  mq-sync-interval: 60000
  redis-command-timeout: 2
