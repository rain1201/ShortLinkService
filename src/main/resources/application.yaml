spring:
  application:
    name: shortlink
  datasource:
    url: jdbc:hsqldb:file:db/testdb
    username: sa
    password:
    driver-class-name: org.hsqldb.jdbc.JDBCDriver
    hikari:
      auto-commit: false
      connection-timeout: 3000
      validation-timeout: 3000
      max-lifetime: 60000
      maximum-pool-size: 20
      minimum-idle: 1
  redis:
    host: localhost
    port: 6379
    password:
    database: 0
    ssl: false
server:
  port: 8080
logging:
  level:
    root: INFO
    com.test.shortlink: DEBUG
springdoc:
  packages-to-scan: com.test.shortlink.controller
app:
  redirect-code: 302
  check-code-length: 8
  # 默认过期时间（秒），对应 Controller 中 expireAfter 默认值
  default-expire-after: 1000000000
  # Redis 分布式锁超时（秒）
  lock-timeout-seconds: 10
  # 重试次数
  retry-count: 5
  # 重试间隔（毫秒）
  retry-sleep-ms: 50
  # 默认过期时间戳上限
  default-expire-time: 10000000000
  # 视图计数无效标记值
  sentinel-view-count: -9999
  # 更新码校验正则
  update-code-regex: ^[a-zA-Z0-9]{4,16}$
  # Redis 缓存过期时间（秒）
  expire-seconds: 15
  # PoW 验证难度（要求前 N 个字节为 0）
  pow-difficulty: 2
  # PoW 验证码过期时间（秒）
  captcha-expire-seconds: 300
  # Snowflake 配置
  worker-id: 0
  datacenter-id: 0
  # SnowFlake 起始纪元（毫秒，2021-01-01 00:00:00 UTC）
  snowflake-epoch: 1609459200000
  # Worker ID 取值范围（0 ~ max-worker-id）
  snowflake-max-worker-id: 31
  # Datacenter ID 取值范围（0 ~ max-datacenter-id）
  snowflake-max-datacenter-id: 31
  # Sequence 掩码（12 bits）
  snowflake-sequence-mask: 4095
  # 线程池配置
  executor:
    core-pool-size: 10
    max-pool-size: 100
    queue-capacity: 1000
  # MQ 队列名称
  mq-view-queue: view.queue
  # MQ 消费者配置
  mq:
    max-local-cache-size: 1000
    max-local-cache-time: 100000
    listener-num: 1
  # Redis 命令超时（秒）
  redis-command-timeout: 2

---
spring:
  config:
    activate:
      on-profile: dev
app:
  redirect-code: 200
  check-code-length: 8