spring:
  application:
    name: shortlink
  datasource:
    url: jdbc:hsqldb:file:testdb
    username: sa
    password:
    driver-class-name: org.hsqldb.jdbc.JDBCDriver
    # HikariCP配置:
    hikari:
      auto-commit: false
      connection-timeout: 3000
      validation-timeout: 3000
      max-lifetime: 60000
      maximum-pool-size: 20
      minimum-idle: 1
  redis:
    host: localhost
    port: 6379
    password:
    database: 0
    ssl: false
server:
  port: 8080
logging:
  level:
    root: INFO
    com.test.shortlink: DEBUG
springdoc:
  packages-to-scan: com.test.shortlink.controller
app:
  redirect-code: 302

---
spring:
  config:
    activate:
      on-profile: dev
app:
  redirect-code: 200