services:
  redis:
    image: redis:7.0.11
    volumes:
      - redis_data:/data
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped
  shortlink:
    image: ghcr.io/rain1201/shortlinkservice:${SHORTLINK_IMAGE_TAG:?SHORTLINK_IMAGE_TAG must be set}
    ports:
      - "8081:8080"
    environment:
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: "6379"
      SPRING_REDIS_PASSWORD: "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}"
      SPRING_DATASOURCE_URL: jdbc:hsqldb:file:/data/testdb
      SPRING_DATASOURCE_USERNAME: sa
      SPRING_DATASOURCE_PASSWORD: "${SPRING_DATASOURCE_PASSWORD:-}"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - data:/data
    restart: unless-stopped
volumes:
  data:
    driver: local
  redis_data:
    driver: local
networks:
  default:
    name: shortlink_network
    driver: bridge

